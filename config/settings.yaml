# Card Validation Agent — runtime configuration.
# Every key can be overridden by an environment variable:
#   CARDAGENT_<SECTION>__<KEY>, e.g. CARDAGENT_EMBEDDER__KIND=dinov2_onnx
# Paths are relative to the project root unless absolute.

registry_dir: registry             # optional git-managed card files (registry/cards, registry/refs) -> POST /v1/registry/sync

qdrant:                            # the only store: cards, reference vectors, runs, settings, evaluations
  url: http://127.0.0.1:6333       # in docker compose: http://qdrant:6333. Not "localhost": on Windows it tries
                                   # IPv6 ::1 first and every call waits ~2 s before falling back to IPv4
  api_key: ""                      # set via CARDAGENT_QDRANT__API_KEY
  prefer_grpc: false
  timeout_s: 10
  collection_prefix: cardagent     # -> cardagent_refs, _families, _runs, _evaluations
  reference_store_dir: data/reference_store   # copies of uploaded reference images (keep on a persistent volume)
  keypoint_cache_size: 5000
  refresh_seconds: 5               # replicas pick up card/settings changes made by another replica within this time
  sync_on_startup: false           # true = import registry/ into Qdrant at startup (single-replica / dev setups)

runs:                              # history of every validation + the human review queue
  enabled: true
  store_images: true               # keep each uploaded photo (needed to review and to enroll it as a reference)
  store_dir: data/run_store
  retention_days: 30               # runs and photos older than this are deleted (UAE PDPL: keep only as long as needed)
  stats_max_runs: 50000

evaluation:                        # labelled evaluation sets and reports
  store_dir: data/evaluations
  max_set_bytes: 500000000
  min_accept_precision: 0.99       # gate
  min_status_agreement: 0.90       # gate

embedder:
  kind: dinov2_onnx                    # classic (no model, CPU) | dinov2_onnx (recommended for production)
  onnx_path: models/dinov2/dinov2_vits14.onnx
  onnx_providers: [CPUExecutionProvider]
  input_size: 224
  similarity_floor: 0.60           # cosine below this counts as 0 (classic ~0.55, dinov2 ~0.60) — recalibrate on real cards

ocr:
  engine: paddle                   # paddle (PaddleOCR models on ONNX Runtime) | tesseract
  paddle_det_model: ""             # "" = PP-OCRv6 small detection, shipped in the rapidocr package
  paddle_rec_model: ""             # "" = PP-OCRv6 small recognition (English + Latin scripts), shipped
  paddle_rec_keys: ""
  paddle_rec_model_ar: models/paddleocr/arabic_PP-OCRv5_rec_mobile.onnx   # python tools/download_ocr_models.py
  paddle_rec_keys_ar: ""
  paddle_min_score: 0.5
  paddle_box_thresh: 0.5
  paddle_unclip_ratio: 1.6
  use_gpu: false                   # true on the T4 (needs onnxruntime-gpu)
  tesseract_lang: eng+ara          # engine: tesseract only
  tesseract_cmd: ""                # empty = find on PATH, then C:\Program Files\Tesseract-OCR (Windows)

retrieval:
  shortlist_refs: 20               # stage-1: nearest reference images from the vector index
  max_verify_refs: 24              # stage-2: max references verified with ORB+RANSAC per request
  refs_per_variant_verify: 2
  orb_features: 1000
  ratio_test: 0.75
  min_inliers: 25                  # RANSAC inliers needed to trust the homography for alignment
  inliers_baseline: 35             # inliers two DIFFERENT cards with a shared template/font typically reach
  inliers_full_score: 120          # inliers that count as a perfect geometric match (calibrate on real refs)
  max_align_shift: 0.12            # card already detected+rectified: ignore a homography that moves a corner more
                                   # than this fraction of card width (good alignments <0.10, bad ones extrapolate)
  max_candidate_refs: 500          # reference images scored per request across the shortlisted card families

scoring:
  family_weights: {text: 0.40, embed: 0.20, geometry: 0.30, colour: 0.10}
  variant_weights: {colour: 0.40, keyword: 0.25, geometry: 0.15, embed: 0.10, prefix: 0.10}
  family_min: 0.50
  family_margin: 0.12
  variant_min: 0.45
  variant_margin: 0.08
  reject_below: 0.30               # family score below this = REJECT (unknown card), between = REVIEW
  geometry_required_without_text: 0.60   # no issuer text read -> accept only on strong design match
  sides_mismatch_geometry: 0.30     # two photos strongly matching different cards -> SIDES_MISMATCH (REVIEW)
  field_min_confidence: 0.55

quality:
  min_side: 400
  min_sharpness: null              # null = by OCR engine (paddle 15, tesseract 80); contrast-normalised
  min_blur: 0                      # legacy raw Laplacian variance (was 60; rejects dim photos); 0 = off
  max_glare: 0.08
  brightness_min: 0.15
  brightness_max: 0.92

vlm:
  enabled: false
  kind: ollama                     # ollama | openai  (openai = any OpenAI-compatible server: vLLM, llama.cpp)
  url: http://vlm:11434            # INTERNAL endpoint only
  model: qwen2.5vl:7b
  timeout_s: 30
  circuit_breaker_failures: 3
  circuit_breaker_cooldown_s: 60

api:
  admin_token: ""                  # set via CARDAGENT_API__ADMIN_TOKEN; empty = admin endpoints disabled
  max_image_bytes: 8000000
  allowed_content_types: [image/jpeg, image/png, image/webp]
  idempotency_cache_size: 2000     # retries keyed on request_id + image hash; 0 disables the cache
  cors_origins: []                 # browser origins allowed to call the API (scheme://host:port, no path).
                                   # Web console on the Vite dev server: ["http://localhost:5173"], or set
                                   # CARDAGENT_API__CORS_ORIGINS='["http://localhost:5173"]'. Empty behind a same-origin proxy.

logging:
  level: INFO
  json: true
  mask_pii: true
