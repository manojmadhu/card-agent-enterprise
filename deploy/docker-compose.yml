# Single T4 host: card agent + Qdrant vector store + optional local VLM sharing one 16 GB GPU.
# `internal: true` network = containers have NO route to the internet.
#
# Start order: qdrant -> registry-sync (one-shot incremental import of registry/ into Qdrant) -> cardagent.
# The platform starts empty: add cards through the API (PUT /v1/cards/{id} + reference uploads), or
# commit them to registry/ and run   docker compose -f deploy/docker-compose.yml run --rm registry-sync
x-agent-env: &agent-env
  CARDAGENT_QDRANT__URL: http://qdrant:6333
  CARDAGENT_QDRANT__API_KEY: ${QDRANT_API_KEY:?set a Qdrant API key}

services:
  qdrant:
    image: qdrant/qdrant:v1.18.1             # mirror to your internal registry and pin a digest
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set a Qdrant API key}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant_storage:/qdrant/storage]   # back up with Qdrant snapshots (docs/OPERATIONS.md)
    networks: [private]                      # not published on the host
    restart: unless-stopped

  registry-sync:                             # one-shot: validate registry/ and apply only the differences
    image: cardagent:1.0.0-gpu
    build: {context: .., dockerfile: deploy/Dockerfile.gpu}
    command: ["python3", "tools/sync_registry.py"]
    environment: *agent-env
    volumes:
      - ../registry:/app/registry:ro
    depends_on: [qdrant]
    networks: [private]
    restart: on-failure:5                    # retries while Qdrant is still starting

  cardagent:
    image: cardagent:1.0.0-gpu
    build: {context: .., dockerfile: deploy/Dockerfile.gpu}
    environment:
      <<: *agent-env
      CARDAGENT_API__ADMIN_TOKEN: ${CARDAGENT_ADMIN_TOKEN:?set an admin token}
      CARDAGENT_VLM__ENABLED: "${CARDAGENT_VLM_ENABLED:-false}"
      CARDAGENT_VLM__URL: http://vlm:11434
      CARDAGENT_VLM__MODEL: qwen2.5vl:7b
    volumes:
      - ../registry:/app/registry:ro          # source for POST /v1/registry/sync
      - reference_store:/app/data/reference_store   # copies of reference images uploaded via the API
      - run_store:/app/data/run_store         # photos of validated cards (run history, review queue)
      - evaluations:/app/data/evaluations     # evaluation sets and reports
    ports: ["127.0.0.1:8080:8080"]           # put behind your internal gateway / mTLS
    networks: [edge, private]
    depends_on:
      registry-sync: {condition: service_completed_successfully}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  vlm:                                       # optional: docker compose --profile vlm up
    profiles: [vlm]
    image: ollama/ollama:latest              # mirror to your internal registry and pin a digest
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "2"
    volumes: [ollama:/root/.ollama]          # pre-load the model: see docs/OPERATIONS.md
    networks: [private]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

networks:
  edge: {}
  private: {internal: true}

volumes:
  qdrant_storage: {}
  reference_store: {}
  run_store: {}
  evaluations: {}
  ollama: {}
