# PLACEHOLDER layout/colours/formats — calibrate with real Esaad samples.
id: ae.esaad
country: AE
issuer: Esaad
name: Esaad
schema_version: 1
keywords: [ESAAD, ESSAD, إسعاد, اسعاد]
negative_keywords: [FAZAA, فزعة]

variants:
  - {id: classic,   name: Esaad Classic,   body_color_rgb: [24, 92, 160],   keywords: [CLASSIC],              number_prefix: "10"}
  - {id: gold,      name: Esaad Gold,      body_color_rgb: [196, 152, 46],  keywords: [GOLD, ذهبية],        number_prefix: "20"}
  - {id: platinum,  name: Esaad Platinum,  body_color_rgb: [160, 165, 172], keywords: [PLATINUM, بلاتينية], number_prefix: "30"}
  - {id: privilege, name: Esaad Privilege, body_color_rgb: [22, 22, 26],    keywords: [PRIVILEGE],            number_prefix: "40"}

fields:
  - {name: holder_name, roi: [0.05, 0.62, 0.80, 0.75], regex: "[A-Z][A-Z .'-]{2,40}", normalise: upper}
  - {name: card_number, roi: [0.05, 0.44, 0.80, 0.58], regex: "\\d{12}", normalise: digits}
  - {name: emirates_id, roi: [0.05, 0.78, 0.60, 0.90], regex: "784-\\d{4}-\\d{7}-\\d", normalise: emirates_id, anchor: ID, required: false}
  - {name: expiry_date, roi: [0.60, 0.78, 0.96, 0.90], regex: "(0[1-9]|1[0-2])/(\\d{2}|\\d{4})", normalise: date_mm_yy, anchor: EXP}

rules:
  - {type: regex, field: card_number, critical: true}
  - {type: regex, field: holder_name}
  - {type: emirates_id_format, field: emirates_id}
  - {type: not_expired, field: expiry_date, critical: true}
  - {type: prefix_matches_variant, field: card_number}
  - {type: lookup, field: card_number}
