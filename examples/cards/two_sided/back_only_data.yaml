# Template: a card whose FRONT shows only the logo and whose BACK carries every field.
# The back is required (required fields are on it); the front is optional: when it is sent it helps
# identification (logo, colour), and the variant colour is taken from it.
id: qa.example_back_data
country: QA
issuer: Example Issuer
name: Example Back-Data Card
keywords: [EXAMPLEDELTA]
negative_keywords: []
sides:
  - id: front                              # required: false is implied (no fields on it)
  - id: back
variants:
  - id: standard
    name: Example Standard
    body_color_rgb: [96, 32, 128]
    keywords: []
    number_prefix: "9"
fields:
  - {name: holder_name, side: back, roi: [0.05, 0.36, 0.75, 0.49], regex: "[A-Z][A-Z .'-]{2,40}", normalise: upper}
  - {name: card_number, side: back, roi: [0.05, 0.53, 0.75, 0.67], regex: "\\d{10}", normalise: digits}
  - {name: expiry_date, side: back, roi: [0.05, 0.71, 0.50, 0.85], regex: "(0[1-9]|1[0-2])/(\\d{2}|\\d{4})",
     normalise: date_mm_yy, anchor: EXP}
rules:
  - {type: regex, field: card_number, critical: true}
  - {type: not_expired, field: expiry_date, critical: true}
