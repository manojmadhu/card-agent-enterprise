# Template: a card with data on BOTH sides (name + expiry on the front, card number on the back).
# Both sides are required because each carries a required field. Calibrate every value on real,
# consented cards: keywords, colours, prefixes and the ROIs (fractions of the reference image of the
# field's side, x0 y0 x1 y1). Reference images: upload per variant and side (?side=front / ?side=back).
id: ae.example_two_sided
country: AE
issuer: Example Issuer
name: Example Two-Sided Card
keywords: [EXAMPLECARD, "بطاقة"]
negative_keywords: []
sides:
  - id: front
  - id: back
variants:
  - id: silver
    name: Example Silver
    body_color_rgb: [160, 162, 170]        # front body colour
    keywords: [SILVER]
    number_prefix: "3"
  - id: gold
    name: Example Gold
    body_color_rgb: [196, 152, 46]
    keywords: [GOLD]
    number_prefix: "4"
fields:
  - name: holder_name
    side: front
    roi: [0.05, 0.55, 0.75, 0.68]
    regex: "[A-Z][A-Z .'-]{2,40}"
    normalise: upper
  - name: expiry_date
    side: front
    roi: [0.05, 0.72, 0.50, 0.86]
    regex: "(0[1-9]|1[0-2])/(\\d{2}|\\d{4})"
    normalise: date_mm_yy
    anchor: EXP
  - name: card_number
    side: back                             # printed on the back
    roi: [0.05, 0.60, 0.75, 0.74]          # measured on a reference image of the BACK
    regex: "\\d{10}"
    normalise: digits
rules:
  - {type: regex, field: card_number, critical: true}
  - {type: not_expired, field: expiry_date, critical: true}
  - {type: prefix_matches_variant, field: card_number}
