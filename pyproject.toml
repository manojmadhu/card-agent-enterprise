[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardagent"
version = "1.0.0"
description = "Offline discount/membership card identification and validation agent"
requires-python = ">=3.10"
dependencies = [
  "opencv-python-headless>=4.9,<5", "numpy>=1.26", "pillow>=10", "pyyaml>=6",
  "pydantic>=2.6", "pydantic-settings>=2.2", "fastapi>=0.110", "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9", "prometheus-client>=0.20", "qdrant-client==1.18.0",
  "pytesseract>=0.3.10",
  "onnxruntime>=1.17",
  "rapidocr>=3.10,<4", "python-bidi>=0.4.2,<1",   # PaddleOCR models (PP-OCRv6/v5) on ONNX Runtime; RTL order
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]          # replaces onnxruntime on GPU hosts
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
